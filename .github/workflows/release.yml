name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, exactly v<project-version> (for example v0.1.4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'cluefinch/mcp-server' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate release tag and checked-out commit
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python scripts/check_release_tag.py "$RELEASE_TAG"
          commit_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$commit_sha"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12.4', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check mcp_search tests scripts
      - run: uv run ruff format --check mcp_search tests scripts
      - run: uv run pytest -q
      - run: uv build

  build:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12.4'
      - run: uv python install
      - run: uv sync --locked
      - run: uv build --out-dir release-dist
      - run: uv run python scripts/check_release.py release-dist
      - run: uvx --from 'twine==7.0.0' twine check --strict release-dist/*
      - run: |
          uv venv /tmp/cluefinch-release-venv
          uv pip install --python /tmp/cluefinch-release-venv/bin/python release-dist/*.whl
          /tmp/cluefinch-release-venv/bin/python scripts/smoke_installed.py /tmp/cluefinch-release-venv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ needs.prepare.outputs.commit_sha }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ needs.prepare.outputs.commit_sha }}
          path: dist
      - name: Verify release tag still identifies the prepared commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        shell: bash
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags%2F$RELEASE_TAG" --jq '.sha')
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag no longer identifies the prepared commit"
            exit 1
          fi
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ needs.prepare.outputs.commit_sha }}
          path: dist
      - name: Create GitHub Release from published tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        shell: bash
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags%2F$RELEASE_TAG" --jq '.sha')
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag no longer identifies the prepared commit"
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Cluefinch MCP $RELEASE_TAG"

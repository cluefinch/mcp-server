name: Checks
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12.4', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check mcp_search tests scripts
      - run: uv run ruff format --check mcp_search tests scripts
      - run: uv run pytest -q
      - run: uv build

  lowest-direct:
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12.4'
      - run: uv python install
      - name: Resolve lowest direct dependencies
        run: |
          rm uv.lock
          uv lock
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12.4'
      - run: uv python install
      - run: uv sync --locked
      - run: uvx --from 'pyright==1.1.414' pyright --pythonpath .venv/bin/python mcp_search scripts

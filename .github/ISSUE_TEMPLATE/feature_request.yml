name: Feature request
description: Propose a focused capability or contract improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: What agent workflow or retrieval problem is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the capability or contract change, not an implementation mandate.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and tradeoffs
      description: Note compatibility, security, context-budget, or local-first implications you are aware of.

services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8081}:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Create .env with a random SEARXNG_SECRET before starting}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
